# NOTE on network-device autodiscovery (NETTRACE_DISCOVERY_ENABLED=true):
# this compose file's `nettrace` service is attached only to the isolated
# `demo-net` bridge network below, which cannot reach your real LAN --
# SNMP/SSH discovery run from inside this container will simply fail to
# reach real devices. Discovery also needs Dockerfile.discovery (installs
# pysnmp/paramiko), not the default Dockerfile. If you want to point
# discovery at your real network:
#   - Linux only: add `network_mode: "host"` to the nettrace service below
#     (this is incompatible with the `ports:`/`networks:` keys -- remove
#     them if you do this) and switch `build: .` to
#     `build: {context: ., dockerfile: Dockerfile.discovery}`.
#   - Mac/Windows (Docker Desktop has no real host-networking equivalent):
#     run `NETTRACE_DISCOVERY_ENABLED=true python3 app.py` directly on the
#     host instead of via Docker.
# See README.md's "Network layer & autodiscovery" section for the full story.
services:
  nettrace:
    build: .
    container_name: nettrace-sankey
    ports:
      - "${HOST_PORT:-8766}:8766"
    environment:
      - OTEL_COLLECTOR_HOST=otel-collector
      - OTEL_COLLECTOR_HTTP_PORT=4318
      - OTEL_COLLECTOR_METRICS_PORT=8889
    depends_on:
      - otel-collector
    networks:
      - demo-net
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: nettrace-otel-collector
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "${OTEL_HTTP_PORT:-4318}:4318"
      - "${OTEL_METRICS_PORT:-8889}:8889"
    networks:
      - demo-net
    restart: unless-stopped

networks:
  demo-net:
    name: demo-net
    external: true
